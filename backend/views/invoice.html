<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invoice — Ennys</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--pri:#e65c00;--ink:#1a1a1a;--muted:#888;--line:#eee}
  *{box-sizing:border-box}
  body{font-family:'Inter',sans-serif;color:var(--ink);margin:0;background:#f5f5f4}
  .toolbar{position:sticky;top:0;background:#1a1a1a;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;z-index:10}
  .toolbar .brand{color:#fff;font-weight:800;font-size:14px}
  .toolbar button{background:var(--pri);color:#fff;border:none;padding:8px 18px;border-radius:6px;font-size:12.5px;font-weight:700;cursor:pointer}
  .toolbar button:hover{opacity:.92}
  .sheet{max-width:800px;margin:28px auto;background:#fff;padding:48px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .head-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:36px}
  .store-name{font-size:24px;font-weight:800;letter-spacing:-.5px}
  .store-name span{color:var(--pri)}
  .store-meta{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.6}
  .invoice-title{font-size:26px;font-weight:800;color:var(--pri);text-align:right}
  .invoice-meta{font-size:11.5px;color:var(--muted);text-align:right;margin-top:6px;line-height:1.6}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:32px;padding-top:24px;border-top:1px solid var(--line)}
  .label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
  .val{font-size:13px;line-height:1.6}
  table{width:100%;border-collapse:collapse;margin-bottom:24px}
  th{text-align:left;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:0 0 10px;border-bottom:1.5px solid var(--ink)}
  th.num,td.num{text-align:right}
  td{padding:12px 0;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
  .item-name{font-weight:700}
  .item-sub{font-size:11px;color:var(--muted);margin-top:2px}
  .totals{margin-left:auto;width:280px}
  .totals-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0}
  .totals-row.muted{color:var(--muted)}
  .totals-row.grand{font-size:16px;font-weight:800;color:var(--pri);border-top:1.5px solid var(--ink);margin-top:6px;padding-top:12px}
  .status-badge{display:inline-block;font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px}
  .status-paid{background:#e8f5e9;color:#2e7d32}
  .status-unpaid,.status-failed{background:#ffebee;color:#c62828}
  .footer-note{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);text-align:center}
  .error{padding:40px;text-align:center;color:#c62828;font-size:14px}
  @media print{
    body{background:#fff}
    .toolbar{display:none}
    .sheet{box-shadow:none;margin:0 auto;max-width:700px;padding:16px 8px}
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="brand">Ennys — Invoice</div>
  <button onclick="window.print()">🖨 Print / Save as PDF</button>
</div>

<div class="sheet" id="sheet">
  <div class="error">Loading invoice…</div>
</div>

<script>
function money(n) { return '£' + Number(n || 0).toFixed(2); }
function formatWeight(grams) {
  return grams >= 1000 ? `${(grams / 1000).toFixed(2).replace(/\.?0+$/, '')} kg` : `${grams} g`;
}

async function apiFetch(url) {
  const res = await fetch(url, { credentials: 'include' });
  if (res.status === 401) { location.href = '/login'; throw new Error('Not authenticated'); }
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  return res.json();
}

function itemRowHtml(it) {
  return `
    <tr>
      <td>
        <div class="item-name">${it.product_name}</div>
        ${it.variation_summary ? `<div class="item-sub">${it.variation_summary}</div>` : ''}
      </td>
      <td class="num">${it.quantity}</td>
      <td class="num">${money(it.unit_price)}</td>
      <td class="num">${money(it.line_total)}</td>
    </tr>`;
}

(async () => {
  const id = new URLSearchParams(location.search).get('id');
  const sheet = document.getElementById('sheet');
  if (!id) { sheet.innerHTML = '<div class="error">No order specified.</div>'; return; }

  let order, footer;
  try {
    [order, footer] = await Promise.all([
      apiFetch(`/api/orders/${id}`),
      apiFetch('/api/cms/footer').catch(() => ({}))
    ]);
  } catch (e) {
    sheet.innerHTML = `<div class="error">${e.message || 'Unable to load this order.'}</div>`;
    return;
  }

  document.title = `Invoice ${order.order_number} — Ennys`;

  const statusClass = order.payment_status === 'paid' ? 'status-paid' : 'status-unpaid';

  sheet.innerHTML = `
    <div class="head-row">
      <div>
        <div class="store-name">Enny<span>s.</span></div>
        <div class="store-meta">
          ${footer.address || ''}<br>
          ${footer.email || ''}${footer.phone ? ` &middot; ${footer.phone}` : ''}
        </div>
      </div>
      <div>
        <div class="invoice-title">INVOICE</div>
        <div class="invoice-meta">
          ${order.order_number}<br>
          ${new Date(order.created_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' })}<br>
          <span class="status-badge ${statusClass}" style="margin-top:4px">${order.payment_status}</span>
        </div>
      </div>
    </div>

    <div class="two-col">
      <div>
        <div class="label">Billed To</div>
        <div class="val">
          <strong>${order.customer_name}</strong><br>
          ${order.customer_email || ''}<br>
          ${order.customer_phone || ''}
        </div>
      </div>
      <div>
        <div class="label">Delivery Address</div>
        <div class="val">${order.delivery_address || '—'}</div>
        <div class="label" style="margin-top:12px">Delivery Type</div>
        <div class="val">${order.delivery_type || '—'}</div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Item</th>
          <th class="num">Qty</th>
          <th class="num">Unit Price</th>
          <th class="num">Total</th>
        </tr>
      </thead>
      <tbody>
        ${order.items.map(itemRowHtml).join('')}
      </tbody>
    </table>

    <div class="totals">
      <div class="totals-row muted"><span>Subtotal</span><span>${money(order.subtotal)}</span></div>
      <div class="totals-row muted"><span>Delivery</span><span>${order.delivery_fee ? money(order.delivery_fee) : 'FREE'}</span></div>
      ${order.discount_amount > 0 ? `<div class="totals-row muted"><span>Discount${order.promo_code ? ` (${order.promo_code})` : ''}</span><span>-${money(order.discount_amount)}</span></div>` : ''}
      ${order.totalWeight > 0 ? `<div class="totals-row muted"><span>Total Weight</span><span>${formatWeight(order.totalWeight)}</span></div>` : ''}
      <div class="totals-row grand"><span>Total</span><span>${money(order.total)}</span></div>
    </div>

    <div class="footer-note">Thank you for shopping with Ennys — ${footer.address || 'Birmingham, UK'}</div>
  `;
})();
</script>
</body>
</html>
