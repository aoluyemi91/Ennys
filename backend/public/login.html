<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ennys Admin — Log In</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a1a;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .box{background:#fff;border-radius:12px;padding:32px;width:100%;max-width:340px}
  .logo{font-size:26px;font-weight:900;font-style:italic;letter-spacing:-1px;margin-bottom:4px}
  .logo span{color:#e65c00}
  .sub{font-size:12px;color:#888;font-weight:600;margin-bottom:24px}
  .fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
  .fg label{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.3px}
  .fg input{padding:9px 12px;border:1.5px solid #e0e0e0;border-radius:7px;font-size:13px;outline:none}
  .fg input:focus{border-color:#e65c00}
  button{width:100%;background:#e65c00;color:#fff;border:none;padding:10px;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;margin-top:6px}
  button:hover{background:#b84500}
  .err{color:#c62828;font-size:12px;margin-top:10px;display:none}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">Ennys<span>.</span></div>
    <div class="sub">Store Admin — Log In</div>
    <form id="loginForm">
      <div class="fg"><label>Username</label><input id="username" autocomplete="username" required></div>
      <div class="fg"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button type="submit">Log In →</button>
      <div class="err" id="errMsg"></div>
    </form>
  </div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errMsg = document.getElementById('errMsg');
  errMsg.style.display = 'none';
  const res = await fetch('/api/auth/login', {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      username: document.getElementById('username').value,
      password: document.getElementById('password').value
    })
  });
  if (res.ok) {
    location.href = '/admin';
  } else {
    const data = await res.json().catch(() => ({}));
    errMsg.textContent = data.error || 'Login failed';
    errMsg.style.display = 'block';
  }
});
</script>
</body>
</html>
