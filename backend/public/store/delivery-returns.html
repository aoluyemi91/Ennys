<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Delivery & Returns — Ennys</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Delivery options, timings and our returns policy at Ennys.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/store/css/store.css">
</head>
<body>

<div id="siteHeader"></div>

<main>
  <section class="content-hero">
    <div class="container">
      <h1>Delivery &amp; Returns</h1>
      <p id="deliveryIntro"></p>
    </div>
  </section>

  <section class="section container">
    <div class="prose">
      <section>
        <h2>Delivery</h2>
        <ul id="deliveryList"></ul>
        <p id="deliveryHighlight" style="font-weight:700;color:var(--pri-dk)"></p>
      </section>

      <section>
        <h2>Returns &amp; Refunds</h2>
        <div id="returnsParagraphs"></div>
        <ul id="returnsBullets"></ul>
      </section>

      <section>
        <div class="contact-block">
          <h3>Need to report an issue with your order?</h3>
          <p id="contactPhone"></p>
          <p id="contactEmail"></p>
        </div>
      </section>
    </div>
  </section>
</main>

<div id="siteFooter"></div>

<script src="/store/js/api.js"></script>
<script src="/store/js/cart.js"></script>
<script src="/store/js/layout.js"></script>
<script>
apiFetch('/api/storefront/cms/delivery_returns_page').then(p => {
  document.getElementById('deliveryIntro').textContent = p.intro || '';
  document.getElementById('returnsParagraphs').innerHTML = (p.returns_paragraphs || []).map(t => `<p>${t}</p>`).join('');
  document.getElementById('returnsBullets').innerHTML = (p.returns_bullets || []).map(t => `<li>${t}</li>`).join('');
}).catch(() => {});

apiFetch('/api/storefront/cms/footer').then(f => {
  const lines = [f.delivery_line1, f.delivery_line2, f.delivery_line3].filter(Boolean);
  document.getElementById('deliveryList').innerHTML = lines.map(l => `<li>${l}</li>`).join('');
  document.getElementById('deliveryHighlight').textContent = f.delivery_highlight || '';
  document.getElementById('contactPhone').innerHTML = f.phone ? `📞 <a href="tel:${f.phone.replace(/\s+/g, '')}">${f.phone}</a>` : '';
  document.getElementById('contactEmail').innerHTML = f.email ? `✉️ <a href="mailto:${f.email}">${f.email}</a>` : '';
}).catch(() => {});
</script>
</body>
</html>
